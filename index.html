    <title>%VITE_APP_TITLE%</title>
    <script>
      try {
        // VITE_APP_DISABLE_DEVTOOL 为 true 时屏蔽 F12 / 右键 / 查看源码快捷键。
        // 它只是提高随手打开的难度，不构成安全边界（详见 docs/guide/deploy.md）。
        if ('%VITE_APP_DISABLE_DEVTOOL%' === 'true') {
          document.addEventListener('contextmenu', (event) => event.preventDefault())
          document.addEventListener('keydown', (event) => {
            const key = event.key.toUpperCase()
            if (
              key === 'F12' ||
              (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(key)) ||
              (event.metaKey && event.altKey && ['I', 'J', 'C'].includes(key)) ||
              (event.ctrlKey && key === 'U')
            ) {
              event.preventDefault()
            }
          })
        }
      } catch (_) {}
      try {
        var a = JSON.parse(localStorage.getItem('%VITE_APP_STORAGE_PREFIX%' + 'appearance') || '{}').state
        var p = a?.accessibility
        document.documentElement.dataset.fontScale = [100, 112.5, 125, 150].includes(p?.fontScale) ? String(p.fontScale) : '100'
        document.documentElement.dataset.fontWeight = ['default', 'medium', 'bold'].includes(p?.fontWeight) ? p.fontWeight : 'default'
        document.documentElement.dataset.highContrast = String(p?.highContrast === true)
        document.documentElement.dataset.reduceMotion = String(p?.reduceMotion === true)
        document.documentElement.dataset.underlineLinks = String(p?.underlineLinks === true)
        var t = a?.theme
        document.documentElement.dataset.palette =
          ['teal', 'blue', 'forest', 'violet', 'amber', 'graphite', 'custom'].includes(a?.palette) ? a.palette : 'teal'
        var d =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var c = a?.customColors?.[d ? 'dark' : 'light']
        document.documentElement.dataset.baseColor =
          ['neutral', 'stone', 'zinc', 'mauve', 'olive', 'mist', 'taupe'].includes(c?.baseColor) ? c.baseColor : 'neutral'
        document.documentElement.dataset.themeColor =
          ['default', 'amber', 'blue', 'cyan', 'emerald', 'fuchsia', 'green', 'indigo', 'lime', 'orange', 'pink', 'purple', 'red', 'rose', 'sky', 'teal', 'violet', 'yellow'].includes(c?.themeColor) ? c.themeColor : 'default'
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      } catch (_) {}
    </script>
